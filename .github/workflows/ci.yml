name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

defaults:
  run:
    working-directory: server

env:
  CARGO_TERM_COLOR: always

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Debug
        run: cargo build

  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Release
        run: cargo build --bin flare --release

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Format Check
        run: cargo fmt -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Lint Code
        run: cargo clippy -- -D warnings

  openapi:
    runs-on: ubuntu-latest
    needs: [build-debug]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate OpenAPI
        run: cargo build --bin api-doc > openapi.json
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi.json
          path: server/openapi.json
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    needs: [build-debug]
    env:
      PG_BASE: postgres://flare:12345@localhost:5432
    services:
      postgres:
        env:
          POSTGRES_USER: flare
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: flare-db-test
        image: postgres:17.4
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:8.1.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run Tests
        run: cargo llvm-cov nextest --no-fail-fast --all --ignore-filename-regex '(sea-entity|sea-migration).*\.rs' --color always --codecov --output-path codecov.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  fuzz:
    runs-on: ubuntu-latest
    needs: [build-debug, openapi]
    env:
      PG_BASE: postgres://flare:12345@localhost:5432
    services:
      postgres:
        env:
          POSTGRES_USER: flare
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: flare-db
        image: postgres:17.4
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:8.1.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and run application
        run: |
          mv config.example.toml config.toml
          cargo build --features fuzz
          cargo run --features fuzz > server.log 2>&1 &
          tail -F server.log &
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/ping > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -s http://localhost:8080/api/login -X 'POST' -H 'Content-Type: application/json' -d '{"id": "fuzz"}'
      - name: Run fuzzer
        uses: schemathesis/action@v1
        with:
          schema: "http://localhost:8080/api/docs/openapi.json"
          base-url: "http://localhost:8080/"
          checks: "all"
          args: '-H "Authorization: Bearer dummy-auth" --experimental=openapi-3.1 --exclude-checks ignored_auth --validate-schema=true --exclude-tag oauth'
