[package]
name = "flare-sim"
version = "0.1.0"
edition = "2024"

[lib]
test = false
doctest = false

[dependencies]
flare = { path = "../flare", features = ["sim"], optional = true }
jsonwebtoken = { git = "https://github.com/arckoor/jsonwebtoken", branch = "custom-provider", features = [
  "custom-provider",
], optional = true }
rand = { version = "0.9.2", features = ["std"], optional = true }
rand_chacha = { version = "0.9.0", optional = true }
reqwest = { version = "0.12.24", features = [
  "json",
  "cookies",
  "rustls-tls",
], default-features = false, optional = true }
reqwest_cookie_store = { version = "0.9.0", optional = true }
sea-entity = { path = "../sea-entity", optional = true }
serde = { version = "1.0.228", optional = true }
tempfile = { version = "3.23.0", optional = true }
tokio = { version = "1.48.0", features = ["sync"], optional = true }
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.20", optional = true }
turmoil = "0.7.0"


[features]
sim = [
  "dep:flare",
  "dep:jsonwebtoken",
  "dep:rand",
  "dep:rand_chacha",
  "dep:reqwest",
  "dep:reqwest_cookie_store",
  "dep:sea-entity",
  "dep:serde",
  "dep:tempfile",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
]
