[package]
name = "flare-sim"
version = "0.1.0"
edition = "2024"

[lib]
test = false
doctest = false

[dependencies]
flare = { path = "../flare", features = ["sim"], optional = true }
jsonwebtoken = { version = "9.3.1", optional = true }
rand = { version = "0.8.5", features = ["std"], optional = true }
rand_chacha = { version = "0.3.1", optional = true }
rand_xoshiro = { version = "0.6.0", optional = true }
reqwest = { version = "0.12.15", features = [
  "json",
  "cookies",
], optional = true }
reqwest_cookie_store = { version = "0.8.0", optional = true }
sea-entity = { path = "../sea-entity", optional = true }
serde = { version = "1.0.219", optional = true }
tempfile = { version = "3.19.1", optional = true }
tokio = { version = "1.44.1", features = ["sync"], optional = true }
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.18", optional = true }
turmoil = "0.6.6"


[features]
sim = [
  "dep:flare",
  "dep:jsonwebtoken",
  "dep:rand",
  "dep:rand_chacha",
  "dep:rand_xoshiro",
  "dep:reqwest",
  "dep:reqwest_cookie_store",
  "dep:sea-entity",
  "dep:serde",
  "dep:tempfile",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
]
