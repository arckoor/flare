[package]
name = "flare-test"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
flare = { path = "../flare" }
flare-sim = { path = "../flare-sim", features = ["sim"] }
reqwest = { version = "0.12.19", features = [
  "json",
  "cookies",
  "multipart",
], default-features = false }
sea-entity = { path = "../sea-entity" }
sea-orm = { version = "1.1.12", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
tokio = { version = "1.45.1", features = ["full"] }
