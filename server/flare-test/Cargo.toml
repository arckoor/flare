[package]
name = "flare-test"
version = "0.1.0"
edition = "2024"

# this exists to make crane shut up about this crate not having any targets
[[test]]
name = "basic"
path = "tests/basic.rs"

[dev-dependencies]
flare = { path = "../flare" }
flare-sim = { path = "../flare-sim", features = ["sim"] }
reqwest = { version = "0.12.24", features = [
  "json",
  "cookies",
  "multipart",
], default-features = false }
sea-entity = { path = "../sea-entity" }
sea-orm = { version = "1.1.19", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
tokio = { version = "1.48.0", features = ["full"] }
