[package]
name = "flare"
version = "0.1.1"
edition = "2024"
default-run = "flare"

[lib]
doctest = false

[[bin]]
name = "flare"
path = "src/bin/main.rs"
test = false

[[bin]]
name = "api-doc"
path = "src/bin/openapi.rs"
required-features = ["api-doc"]
test = false

[dependencies]
aes-gcm = "0.10.3"
ammonia = "4.0.0"
axum = { version = "0.8.1", features = ["multipart"] }
axum-extra = { version = "0.10.0", features = ["typed-header", "cookie"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
config = "0.15.11"
cookie = "0.18.1"
cuid2 = "0.1.4"
hyper = "1.6.0"
image = { version = "0.25.5", features = ["jpeg", "png"] }
jsonwebtoken = "9.3.1"
mime = "0.3.17"
oauth2 = "5.0.0"
redis = { version = "0.29.2", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12.15", features = ["json"] }
rustls = { version = "0.23.25", features = ["aws_lc_rs"], default-features = false}
rustls-pemfile = "2.2.0" # TODO: https://crates.io/crates/rustls-pki-types
sea-entity = { path = "../sea-entity" }
sea-migration = { path = "../sea-migration" }
sea-orm = { version = "1.1.7", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
secstr = "0.5.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19" }
utoipa = { version = "5.3.1" }
utoipa-swagger-ui = { version = "9.0.0", features = ["axum"] }

[features]
default = ["api-doc"]
sim = []
api-doc = []
